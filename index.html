<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mein Deutsch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div>
          <p class="kicker">Mein Deutsch</p>
          <h1>我的德语学习 App</h1>
          <p class="subtitle">把今天学到的德语、中文、English 和例句保存下来，之后随时搜索复习。</p>
        </div>
        <button class="add-button" id="addButton" type="button">新增</button>
      </header>

      <nav class="mode-switch" aria-label="学习内容入口">
        <button class="mode-button active" data-mode="vocabulary" type="button">词句小抄</button>
        <button class="mode-button" data-mode="grammar" type="button">纯语法</button>
      </nav>

      <section class="composer hidden" id="composer" aria-label="新增学习内容">
        <form id="entryForm">
          <div class="form-grid">
            <fieldset class="source-fields">
              <legend>课程来源</legend>
              <input id="levelInput" name="level" type="hidden" />
              <label>
                分类
                <input id="bookInput" name="book" list="bookOptions" autocomplete="off" placeholder="例如：B2.1" />
                <datalist id="bookOptions">
                  <option value="A2.1"></option>
                  <option value="A2.2"></option>
                  <option value="B1.1"></option>
                  <option value="B1.2"></option>
                  <option value="B2.1"></option>
                </datalist>
              </label>
              <label>
                课程
                <input id="lessonInput" name="lesson" autocomplete="off" placeholder="例如：第一课 / Lektion 1" />
              </label>
            </fieldset>
            <label>
              德语
              <input id="germanInput" name="german" autocomplete="off" lang="de" spellcheck="true" />
            </label>
            <label>
              中文
              <input id="chineseInput" name="chinese" autocomplete="off" />
            </label>
            <details class="extra-fields">
              <summary>更多内容</summary>
              <div class="extra-grid">
                <label>
                  English
                  <input id="englishInput" name="english" autocomplete="off" />
                </label>
                <label class="wide-field">
                  德语例句
                  <textarea id="exampleInput" name="example" lang="de" spellcheck="true"></textarea>
                </label>
                <label class="wide-field">
                  中文翻译
                  <textarea id="translationInput" name="translation"></textarea>
                </label>
              </div>
            </details>
          </div>
          <div class="form-actions">
            <button class="secondary-button" id="cancelButton" type="button">取消</button>
            <button class="polish-button" id="polishButton" type="button">整理书写</button>
            <button class="save-button" id="saveButton" type="submit">保存</button>
          </div>
        </form>
      </section>

      <section class="composer hidden" id="grammarComposer" aria-label="新增语法内容">
        <form id="grammarForm">
          <div class="form-grid">
            <label>
              语法标题
              <input id="grammarTitleInput" name="title" autocomplete="off" placeholder="例如：Konjunktiv II" />
            </label>
            <label>
              课程
              <input id="grammarLessonInput" name="lesson" autocomplete="off" placeholder="例如：B2.1 第一课" />
            </label>
            <label class="wide-field">
              规则 / 解释
              <textarea id="grammarRuleInput" name="rule" placeholder="这里写这个语法怎么用"></textarea>
            </label>
            <label class="wide-field">
              结构 / 公式
              <textarea id="grammarPatternInput" name="pattern" placeholder="例如：würde + Infinitiv"></textarea>
            </label>
            <label class="wide-field">
              德语例句
              <textarea id="grammarExampleInput" name="example" lang="de" spellcheck="true"></textarea>
            </label>
            <label class="wide-field">
              我的笔记
              <textarea id="grammarNoteInput" name="note"></textarea>
            </label>
          </div>
          <div class="form-actions">
            <button class="secondary-button" id="grammarCancelButton" type="button">取消</button>
            <button class="polish-button" id="grammarPolishButton" type="button">整理书写</button>
            <button class="save-button" id="grammarSaveButton" type="submit">保存</button>
          </div>
        </form>
      </section>

      <section class="toolbar" aria-label="搜索">
        <div class="search-tools">
          <input id="searchInput" type="search" placeholder="搜索德语、中文、English 或例句" />
          <select id="sourceFilter" aria-label="按课程来源筛选">
            <option value="全部">全部来源</option>
          </select>
        </div>
        <div class="data-tools">
          <span id="countText">0 条记录</span>
          <span id="saveStatus">数据已安全保存</span>
          <button class="backup-button" id="backupButton" type="button">导出备份</button>
          <button class="backup-button" id="importBackupButton" type="button">导入/恢复备份</button>
          <input id="backupFileInput" type="file" accept="application/json,.json" hidden />
        </div>
      </section>

      <section class="entries" id="entries"></section>
      <section class="entries hidden" id="grammarEntries"></section>
    </main>

    <template id="entryTemplate">
      <article class="card">
        <div class="card-top">
          <div>
            <p class="date"></p>
            <p class="source"></p>
            <h2 class="german"></h2>
          </div>
          <div class="card-actions">
            <button class="speak-button" data-speak-field="german" type="button">读德语</button>
            <button class="speak-button" data-speak-field="example" type="button">读例句</button>
            <button class="edit-button" type="button">修改</button>
            <button class="more-button" type="button">更多</button>
            <div class="danger-actions hidden">
              <button class="delete-button" type="button">删除</button>
            </div>
          </div>
        </div>
        <dl>
          <div class="entry-row" data-field="chinese">
            <dt>中文</dt>
            <dd class="chinese"></dd>
          </div>
          <div class="entry-row" data-field="english">
            <dt>English</dt>
            <dd class="english"></dd>
          </div>
          <div class="entry-row" data-field="example">
            <dt>德语例句</dt>
            <dd class="example"></dd>
          </div>
          <div class="entry-row" data-field="translation">
            <dt>中文翻译</dt>
            <dd class="translation"></dd>
          </div>
        </dl>
      </article>
    </template>

    <template id="grammarTemplate">
      <article class="card grammar-card">
        <div class="card-top">
          <div>
            <p class="date"></p>
            <p class="source"></p>
            <h2 class="grammar-title"></h2>
          </div>
          <div class="card-actions">
            <button class="speak-grammar-button" type="button">读例句</button>
            <button class="grammar-edit-button" type="button">修改</button>
            <button class="grammar-more-button" type="button">更多</button>
            <div class="danger-actions hidden">
              <button class="grammar-delete-button" type="button">删除</button>
            </div>
          </div>
        </div>
        <dl>
          <div class="entry-row" data-field="rule">
            <dt>规则 / 解释</dt>
            <dd class="rule"></dd>
          </div>
          <div class="entry-row" data-field="pattern">
            <dt>结构 / 公式</dt>
            <dd class="pattern"></dd>
          </div>
          <div class="entry-row" data-field="example">
            <dt>德语例句</dt>
            <dd class="example"></dd>
          </div>
          <div class="entry-row" data-field="note">
            <dt>我的笔记</dt>
            <dd class="note"></dd>
          </div>
        </dl>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
